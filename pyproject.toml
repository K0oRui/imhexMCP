[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imhex-mcp"
version = "0.4.0"
description = "ImHex MCP Server - AI assistant integration for ImHex hex editor"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["BLE001", "S110", "N999"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["mcp-server/tests"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "mypy>=1.10",
    "ipython>=9.15.0",
]
lint = [
    "ruff>=0.16.0",
    "mypy>=1.10",
]


