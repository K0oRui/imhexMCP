name: Test Patches

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - '.github/workflows/test-patches.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'patches/**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test-patch-application:
    name: Test patches on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout ImHex MCP
        uses: actions/checkout@v4
        with:
          path: imhexMCP

      - name: Clone ImHex
        run: |
          git clone --depth=1 https://github.com/WerWolv/ImHex.git
          cd ImHex
          echo "IMHEX_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Test patch application (dry-run)
        run: |
          cd ImHex
          for patch in ../imhexMCP/patches/0*.patch; do
            echo "Testing: $(basename $patch)"
            if git apply --check "$patch"; then
              echo "  -> applies cleanly"
            else
              echo "  -> FAILED"
              exit 1
            fi
          done

      - name: Apply all patches
        run: |
          cd ImHex
          git apply ../imhexMCP/patches/0*.patch
          echo "Patches applied successfully"

      - name: Verify MCP plugin exists
        run: |
          if [ -d "ImHex/plugins/mcp" ]; then
            echo "MCP plugin directory exists"
            ls -la ImHex/plugins/mcp/source/
          else
            echo "MCP plugin directory not found"
            ls -la ImHex/plugins/ || true
          fi
