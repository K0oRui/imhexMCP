name: Build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - 'plugin/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'patches/**'
      - 'plugin/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  test-patches:
    name: Test patches on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: imhexMCP

    - name: Clone ImHex
        shell: bash
        run: |
          git clone --depth=1 https://github.com/WerWolv/ImHex.git
          echo "IMHEX_COMMIT=$(cd ImHex && git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Dry-run patches
        shell: bash
        run: |
          cd ImHex
          for patch in ../imhexMCP/patches/[0-9]*.patch; do
            git apply --check "$patch" || { echo "FAILED: $(basename $patch)"; exit 1; }
          done

      - name: Apply patches and sync source
        shell: bash
        run: |
          cd ImHex
          git apply ../imhexMCP/patches/[0-9]*.patch
          mkdir -p plugins/mcp/source
          cp ../imhexMCP/plugin/source/plugin_mcp.cpp plugins/mcp/source/

      - name: Verify plugin source
        shell: bash
        run: |
          lines=$(wc -l < ImHex/plugins/mcp/source/plugin_mcp.cpp)
          echo "plugin_mcp.cpp: $lines lines"
          [ "$lines" -gt 100 ] || exit 1

  build-imhex:
    name: Build on ${{ matrix.os }}
    needs: test-patches
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: imhexMCP

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libglfw3-dev libfreetype6-dev libmbedtls-dev libcurl4-openssl-dev pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config

      - name: Clone ImHex, apply patches, sync source
        run: |
          git clone --depth=1 https://github.com/WerWolv/ImHex.git
          cd ImHex
          git apply ../imhexMCP/patches/[0-9]*.patch
          mkdir -p plugins/mcp/source
          cp ../imhexMCP/plugin/source/plugin_mcp.cpp plugins/mcp/source/

      - name: Build
        run: |
          cd ImHex
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja
          ninja -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Verify plugin
        run: |
          if [ -f "ImHex/build/plugins/mcp.hexplug" ]; then
            echo "mcp.hexplug built: $(ls -lh ImHex/build/plugins/mcp.hexplug | awk '{print $5}')"
          else
            echo "mcp.hexplug not found"
            ls -la ImHex/build/plugins/ || true
            exit 1
          fi
