name: Benchmarks

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r mcp-server/requirements.txt
        pip install pytest-benchmark

    - name: Run benchmarks
      run: |
        cd mcp-server
        python -m pytest tests/ --benchmark-only --benchmark-json benchmark-results.json || true

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: mcp-server/benchmark-results.json
