name: Build Plugin

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-imhex-with-mcp:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libglfw3-dev libfreetype6-dev libmbedtls-dev libcurl4-openssl-dev pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config

      - name: Clone ImHex
        run: |
          git clone --depth=1 https://github.com/WerWolv/ImHex.git
          cd ImHex
          git apply ../patches/*.patch

      - name: Build ImHex with MCP
        run: |
          cd ImHex
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja
          ninja -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Verify MCP plugin
        run: |
          if [ -f "ImHex/build/plugins/mcp.hexplug" ]; then
            echo "MCP plugin built successfully"
            ls -lh ImHex/build/plugins/mcp.hexplug
          else
            echo "MCP plugin not found"
            ls -la ImHex/build/plugins/ || true
            exit 1
          fi
