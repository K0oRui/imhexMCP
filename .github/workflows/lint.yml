name: Lint

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install black ruff mypy

    - name: Check formatting
      run: |
        black --check --diff mcp-server/

    - name: Lint with Ruff
      run: |
        ruff check mcp-server/ --output-format=github || true

    - name: Type check with mypy
      run: |
        mypy mcp-server/ --ignore-missing-imports --install-types --non-interactive || true
